general {
    lock_cmd = python3 ~/dotfiles/quickshell/scripts/lock.py
    inhibit_sleep = 3 # Wait for the compositor to confirm the session is locked.
    before_sleep_cmd = loginctl lock-session                              # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Screenlock
listener {
    # LOCK TIMEOUT
    timeout = 600
    # LOCK ONTIMEOUT
    on-timeout = loginctl lock-session
}

# dpms
listener {
    # DPMS TIMEOUT
    timeout = 0
    # DPMS ONTIMEOUT
    # on-timeout = hyprctl dispatch dpms off
    # DPMS ONRESUME
    # on-resume = hyprctl dispatch dpms on
}

# Suspend
listener {
    # SUSPEND TIMEOUT
    timeout = 1800
    #SUSPEND ONTIMEOUT
    on-timeout = systemctl suspend
}
